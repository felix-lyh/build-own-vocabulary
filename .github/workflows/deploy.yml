name: Deploy Next.js

on:
    push:
        branches:
            - main

jobs:
    verify:
        name: Typecheck & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Build
              run: npm run build

    deploy:
        name: Deploy ECS
        needs: verify
        runs-on: ubuntu-latest

        steps:
            - name: Deploy ECS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.ECS_HOST }}
                  username: ${{ secrets.ECS_USERNAME }}
                  key: ${{ secrets.ECS_SSH_KEY }}

                  script: |
                        cd /opt/build-own-vocabulary
  
                        git fetch origin
                        git reset --hard origin/main

                        docker compose down
                        docker compose build --no-cache
                        docker compose up -d
