name: Deploy Next.js

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy ECS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.ECS_HOST }}
                  username: ${{ secrets.ECS_USERNAME }}
                  key: ${{ secrets.ECS_SSH_KEY }}

                  script: |
                        cd /opt/build-own-vocabulary

                        git pull origin main

                        docker compose down

                        docker compose up -d --build